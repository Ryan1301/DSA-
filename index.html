<!DOCTYPE html>
<html>
<head>
  <title>Hospital Queue System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Hospital Waiting System (FIFO)</h1>

  <input type="text" id="name" placeholder="Name" autocomplete="off" oninput="validateName(this)">
  <input type="text" id="age" placeholder="Age" oninput="validateAge(this)" maxlength="3">
  <input type="text" id="problem" placeholder="Problem">
  <br>

  <button onclick="addPatient()">Add Patient</button>
  <button onclick="servePatient()">Call Next</button>
  <button onclick="clearQueue()">Clear All</button>

  <h3>Total Patients: <span id="count">0</span></h3>

  <h2>Waiting List</h2>

  <table border="1" align="center">
    <thead>
      <tr>
        <th>Token</th>
        <th>Name</th>
        <th>Age</th>
        <th>Problem</th>
      </tr>
    </thead>
    <tbody id="queueTable"></tbody>
  </table>

  <h2 id="serving">Now Serving: None</h2>

  <script src="script.js"></script>
</body>
</html>
